name: iOS TestFlight Deploy

# Manual only. Signing uses Xcode automatic signing with an App Store Connect
# API key (role Admin, so Xcode may create/download cloud-managed distribution
# certificates and profiles); no .p12 or provisioning-profile secrets needed.
#
# Required repository secrets:
#   ENV_DART_BASE64                  base64 of lib/core/config/env.dart
#   FIREBASE_OPTIONS_DART_BASE64     base64 of lib/firebase_options.dart
#   GOOGLE_SERVICE_INFO_PLIST_BASE64 base64 of ios/Runner/GoogleService-Info.plist
#   APP_STORE_CONNECT_API_KEY_ID     key ID (10 characters)
#   APP_STORE_CONNECT_ISSUER_ID      issuer UUID
#   APP_STORE_CONNECT_API_KEY        contents of AuthKey_<KEY_ID>.p8
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (default: the +N from pubspec version)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'

      - name: Write gitignored config files from secrets
        env:
          ENV_DART_BASE64: ${{ secrets.ENV_DART_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$ENV_DART_BASE64" | base64 --decode > lib/core/config/env.dart
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Install dependencies and configure Xcode project
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          flutter pub get
          if [ -n "$BUILD_NUMBER" ]; then
            flutter build ios --release --config-only --build-number="$BUILD_NUMBER"
          else
            flutter build ios --release --config-only
          fi

      - name: Archive
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Export and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        # ios/exportOptions.plist has destination=upload, so -exportArchive
        # uploads the build to App Store Connect directly.
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
