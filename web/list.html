<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List - Shoply</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:title" content="Join this shopping list on Shoply">
    <meta property="og:description" content="Collaborate on shopping lists with family and friends using Shoply">
    <meta property="og:image" content="">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Join this shopping list on Shoply">
    <meta name="twitter:description" content="Collaborate on shopping lists with family and friends using Shoply">
    <meta name="twitter:image" content="">

    <!-- iOS Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=6743532834, app-argument=shoply://list/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1A1A1A;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            padding: 32px 24px 24px;
            text-align: center;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .list-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .meta {
            color: #6B6B6B;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .description {
            color: #A0A0A0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .open-btn {
            display: block;
            width: 100%;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.3px;
            transition: opacity 0.15s;
        }

        .open-btn:hover {
            opacity: 0.85;
        }

        .footer {
            text-align: center;
            padding: 20px 0 0;
            color: #6B6B6B;
            font-size: 13px;
        }

        .footer a {
            color: #A0A0A0;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 12px 0 0;
            color: #6B6B6B;
            font-size: 13px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .loading p {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🛒</div>

        <p class="list-name" id="listName">Shopping List</p>
        <p class="meta" id="listMeta"></p>
        <p class="description">
            Open this shopping list in Shoply to view items, collaborate with others, and check off items as you shop.
        </p>

        <a href="#" class="open-btn" id="openAppBtn">Open in Shoply</a>

        <div class="loading" id="loading">
            <p>Opening app...</p>
        </div>

        <div class="footer">
            Don't have Shoply? <a href="https://apps.apple.com/app/shoply/id6743532834">Download on the App Store</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rtwzzerhgieyxsijemsd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0d3p6ZXJoZ2lleXhzaWplbXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1MDAyOTgsImV4cCI6MjA3NjA3NjI5OH0.modgHtr0QcRd6TTm0-R4eqwynb_jvGYpz-pBmvO6OmA';

        const pathParts = window.location.pathname.split('/');
        const listId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
        const deepLink = `shoply://list/${listId}`;

        document.getElementById('openAppBtn').href = deepLink;

        // Update iOS Smart App Banner
        const metaTag = document.querySelector('meta[name="apple-itunes-app"]');
        if (metaTag) metaTag.content = `app-id=6743532834, app-argument=${deepLink}`;

        // Fetch list details from Supabase
        async function fetchListDetails() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/shopping_lists?id=eq.${listId}&select=name`,
                    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
                );

                if (!res.ok) return;
                const data = await res.json();
                if (!data || data.length === 0) return;

                const list = data[0];
                document.getElementById('listName').textContent = list.name;
                document.title = `${list.name} - Shoply`;
                document.querySelector('meta[property="og:title"]').content = `🛒 ${list.name}`;
            } catch (e) {
                console.log('Could not fetch list details:', e);
            }
        }

        // Try to open app on mobile
        function tryOpenApp() {
            const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('loading').style.display = 'block';
                window.location.href = deepLink;
                setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 2500);
            }
        }

        document.getElementById('openAppBtn').addEventListener('click', () => {
            document.getElementById('loading').style.display = 'block';
        });

        fetchListDetails();
        tryOpenApp();
    </script>
</body>

</html>
