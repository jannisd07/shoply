<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe - Shoply</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:title" content="Check out this recipe on Shoply">
    <meta property="og:description" content="Discover delicious recipes and create smart shopping lists with Shoply">
    <meta property="og:image" content="">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Check out this recipe on Shoply">
    <meta name="twitter:description" content="Discover delicious recipes and create smart shopping lists with Shoply">
    <meta name="twitter:image" content="">

    <!-- iOS Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=6743532834, app-argument=shoply://recipe/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1A1A1A;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            overflow: hidden;
        }

        .hero {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: none;
        }

        .hero-placeholder {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
        }

        .content {
            padding: 28px 24px 24px;
        }

        .recipe-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .meta {
            display: flex;
            gap: 16px;
            color: #6B6B6B;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .description {
            color: #A0A0A0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .open-btn {
            display: block;
            width: 100%;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.3px;
            transition: opacity 0.15s;
        }

        .open-btn:hover {
            opacity: 0.85;
        }

        .footer {
            text-align: center;
            padding: 20px 24px 24px;
            color: #6B6B6B;
            font-size: 13px;
        }

        .footer a {
            color: #A0A0A0;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 12px 0 0;
            color: #6B6B6B;
            font-size: 13px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .loading p {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="hero" id="heroImg" alt="Recipe">
        <div class="hero-placeholder" id="heroPlaceholder">🍳</div>

        <div class="content">
            <p class="recipe-name" id="recipeName">Loading recipe...</p>
            <div class="meta" id="meta" style="display:none">
                <span id="metaTime"></span>
                <span id="metaRating"></span>
                <span id="metaServings"></span>
            </div>
            <p class="description" id="recipeDescription">
                Open this recipe in Shoply to view ingredients, instructions, and add items to your shopping list.
            </p>

            <a href="#" class="open-btn" id="openAppBtn">Open in Shoply</a>

            <div class="loading" id="loading">
                <p>Opening app...</p>
            </div>
        </div>

        <div class="footer">
            Don't have Shoply? <a href="https://apps.apple.com/app/shoply/id6743532834">Download on the App Store</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rtwzzerhgieyxsijemsd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0d3p6ZXJoZ2lleXhzaWplbXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1MDAyOTgsImV4cCI6MjA3NjA3NjI5OH0.modgHtr0QcRd6TTm0-R4eqwynb_jvGYpz-pBmvO6OmA';

        const pathParts = window.location.pathname.split('/');
        const recipeId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
        const deepLink = `shoply://recipe/${recipeId}`;

        document.getElementById('openAppBtn').href = deepLink;

        // Update iOS Smart App Banner
        const metaTag = document.querySelector('meta[name="apple-itunes-app"]');
        if (metaTag) metaTag.content = `app-id=6743532834, app-argument=${deepLink}`;

        // Fetch recipe details from Supabase
        async function fetchRecipeDetails() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/recipes?id=eq.${recipeId}&select=name,description,image_url,total_time_minutes,average_rating,rating_count,default_servings`,
                    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
                );

                if (!res.ok) return;
                const data = await res.json();
                if (!data || data.length === 0) return;

                const r = data[0];
                document.getElementById('recipeName').textContent = r.name;

                if (r.description) {
                    document.getElementById('recipeDescription').textContent = r.description;
                }

                if (r.image_url) {
                    const img = document.getElementById('heroImg');
                    img.src = r.image_url;
                    img.style.display = 'block';
                    document.getElementById('heroPlaceholder').style.display = 'none';
                }

                // Meta info
                const metaEl = document.getElementById('meta');
                if (r.total_time_minutes || r.average_rating || r.default_servings) {
                    metaEl.style.display = 'flex';
                    if (r.total_time_minutes) document.getElementById('metaTime').textContent = `⏱ ${r.total_time_minutes} min`;
                    if (r.average_rating) document.getElementById('metaRating').textContent = `⭐ ${r.average_rating.toFixed(1)}`;
                    if (r.default_servings) document.getElementById('metaServings').textContent = `🍽 ${r.default_servings} servings`;
                }

                // Update page title & OG tags
                document.title = `${r.name} - Shoply`;
                document.querySelector('meta[property="og:title"]').content = `🍳 ${r.name}`;
                document.querySelector('meta[property="og:description"]').content = r.description || 'Check out this recipe on Shoply';
                if (r.image_url) {
                    document.querySelector('meta[property="og:image"]').content = r.image_url;
                    document.querySelector('meta[name="twitter:image"]').content = r.image_url;
                }
            } catch (e) {
                console.log('Could not fetch recipe details:', e);
            }
        }

        // Try to open app on mobile
        function tryOpenApp() {
            const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('loading').style.display = 'block';
                window.location.href = deepLink;
                setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 2500);
            }
        }

        document.getElementById('openAppBtn').addEventListener('click', (e) => {
            document.getElementById('loading').style.display = 'block';
        });

        fetchRecipeDetails();
        tryOpenApp();
    </script>
</body>

</html>
