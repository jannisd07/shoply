server {
    listen 80;
    server_name www.shoplyai.app shoplyai.app;

    root /var/www/shoplyai;
    index index.html;

    # Recipe pages: /recipe/{id} -> recipe.html
    location ~ ^/recipe/(.+)$ {
        try_files /recipe.html =404;
    }

    # List pages: /list/{id} -> list.html
    location ~ ^/list/(.+)$ {
        try_files /list.html =404;
    }

    # Author pages (future): /author/{id} -> author.html
    location ~ ^/author/(.+)$ {
        try_files /author.html /index.html =404;
    }

    # Invite pages: /invite/{id} -> list.html
    location ~ ^/invite/(.+)$ {
        try_files /list.html =404;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
